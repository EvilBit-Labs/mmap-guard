name: Compatibility

on:
    schedule:
        - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    compat:
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/merge-queue/')
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                toolchain:
                    - stable
                    - stable minus 2 releases
                    - stable minus 5 releases
                    - "1.85.0" # MSRV — edition 2024 minimum
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
              with:
                  toolchain: ${{ matrix.toolchain }}

            - name: Build
              run: cargo build

            - name: Run tests
              run: cargo test
