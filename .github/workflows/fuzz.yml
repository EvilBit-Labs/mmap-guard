name: Fuzz

on:
    schedule:
        - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    # Duration (seconds) each fuzz target runs before moving on.
    FUZZ_SECONDS: "60"

jobs:
    fuzz:
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'mergify/merge-queue/')
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: [fuzz_read_bounded, fuzz_map_file]
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Install nightly toolchain
              uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
              with:
                  toolchain: nightly

            - name: Install cargo-fuzz
              env:
                  RUSTUP_TOOLCHAIN: nightly
              run: cargo install cargo-fuzz --locked

            - name: Run fuzz target
              env:
                  TARGET: ${{ matrix.target }}
                  RUSTUP_TOOLCHAIN: nightly
              run: cargo fuzz run "$TARGET" -- -max_total_time="$FUZZ_SECONDS"

            - name: Upload crash artifacts
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: fuzz-crashes-${{ matrix.target }}
                  path: fuzz/artifacts/${{ matrix.target }}/
                  retention-days: 30
